name: Reproduce analyses

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13.5'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - name: Install tested Python dependencies
        run: |
          python -m pip install -r requirements-tested.txt
          python -m pip check
      - name: Remove saved outputs to verify a clean start
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          for directory in ['results', 'figures', 'reports']:
              path = Path(directory)
              if path.exists():
                  shutil.rmtree(path)
          PY
      - name: Run tests and reproduce Python analyses
        run: python src/run_all.py
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.6.1'
      - name: Check PK inputs and statistics in base R
        run: |
          Rscript tests/test_pk_inputs.R
          Rscript src/check_statistics.R
          Rscript src/check_design_sensitivity.R
      - name: Show Python command logs after a failure
        if: failure()
        run: |
          for log in reports/active_command_*.log; do
            if [ -f "$log" ]; then
              printf '\n%s\n' "$log"
              cat "$log"
            fi
          done
          if [ -f reports/execution_report.json ]; then
            cat reports/execution_report.json
          fi
